
# SonarCloud Project Configuration for Prados del Portal 2 - Backend

sonar.projectKey=Andreasilva-code_BackEnd
sonar.organization=andreasilva-code
sonar.host.url=https://sonarcloud.io

# Information
sonar.projectName=Prados del Portal 2 - Backend
sonar.projectVersion=1.0.0

# Source & Test Directories
sonar.sources=modulos,middleware,DB,red,app.js,config.js,index.js
sonar.tests=tests

# Test files
sonar.test.inclusions=**/*.test.js,**/*.spec.js

# Encoding
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=**/node_modules/**,**/coverage/**,**/test-results/**,**/dist/**,**/build/**

# Coverage exclusions
sonar.coverage.exclusions=**/*.test.js,**/*.spec.js,**/config.js,**/middleware/**

# Coverage Report
sonar.javascript.lcov.reportPaths=coverage/lcov.info