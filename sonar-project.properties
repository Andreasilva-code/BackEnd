# SonarCloud Project Configuration for prados2_backend
sonar.projectKey=prados2_backend
sonar.organization=prados2-org

# Information
sonar.projectName=Prados del Portal 2 - Backend
sonar.projectVersion=1.0.0

# Source & Test Directories
sonar.sources=modulos,middleware,DB,red,app.js,config.js,index.js
sonar.tests=tests
sonar.test.inclusions=**/*.test.js,**/*.spec.js

# Encoding & Language Settings
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=**/node_modules/**,**/coverage/**,**/*.config.js
sonar.coverage.exclusions=tests/**,**/node_modules/**

# Coverage Report Path
sonar.javascript.lcov.reportPaths=coverage/lcov.info
